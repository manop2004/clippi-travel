<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>[ClippiJapan] email verification code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f3f4f6; padding: 40px 16px;">
    <tr>
      <td align="center">
        <!-- Main Card Container -->
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 520px; background-color: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; padding: 40px 32px; text-align: center;">
          <tr>
            <td align="center">
              
              <!-- Brand Title / Logo -->
              <h1 style="margin: 0 0 12px 0; font-size: 28px; font-weight: 900; color: #FD775C; tracking-tight: -0.5px;">
                Clippi<span style="color: #231C18;">Japan</span>
              </h1>

              <!-- Subtitle -->
              <h2 style="margin: 0 0 28px 0; font-size: 20px; font-weight: 800; color: #111827;">
                Please verify your identity
              </h2>

              <!-- Inner Grey Box -->
              <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px 20px; margin-bottom: 24px;">
                <p style="margin: 0 0 20px 0; font-size: 14px; font-weight: 600; color: #4b5563;">
                  Here is your ClippiJapan authentication code:
                </p>

                <!-- OTP Code Display Box -->
                <div style="background-color: #ffffff; border: 2px solid #FD775C; border-radius: 14px; padding: 18px 24px; display: inline-block; box-shadow: 0 4px 12px rgba(253,119,92,0.15);">
                  <span style="font-size: 32px; font-weight: 900; color: #FD775C; letter-spacing: 10px; font-family: 'Courier New', Courier, monospace;">
                    {{ .Token }}
                  </span>
                </div>

                <p style="margin: 20px 0 0 0; font-size: 13px; color: #6b7280; font-weight: 500;">
                  This code is valid for <b>15 minutes</b> and can only be used once.
                </p>

                <!-- Warning Box -->
                <div style="margin-top: 24px; background-color: #fff1f2; border: 1px solid #fecdd3; border-radius: 10px; padding: 12px 16px; text-align: left;">
                  <p style="margin: 0; font-size: 12px; color: #e11d48; line-height: 1.5; font-weight: 600;">
                    ⚠️ <b>Please don't share this code with anyone:</b> we'll never ask for it on the phone or via email.
                  </p>
                </div>
              </div>

              <!-- Footer -->
              <p style="margin: 28px 0 0 0; font-size: 13px; color: #9ca3af; font-weight: 500;">
                Thanks,<br/>
                <strong style="color: #4b5563;">The ClippiJapan Team</strong>
              </p>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
