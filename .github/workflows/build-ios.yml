name: Build iOS App (Cloud Build)

on:
  push:
    branches: [ main, master, backend-devnon ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode iOS App for Device
        run: |
          cd ios/App
          pod install || true
          xcodebuild clean -workspace App.xcworkspace -scheme App -configuration Release || true
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

      - name: Create IPA & App Zip Artifacts
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Clippi-iOS-App.ipa Payload
          zip -r Clippi-iOS-App.zip Payload

      - name: Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: clippi-ios-app-ipa
          path: Clippi-iOS-App.ipa

      - name: Upload iOS App Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: clippi-ios-app-zip
          path: Clippi-iOS-App.zip

