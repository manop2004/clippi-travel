name: Build iOS App (Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build iOS Project with Xcode CLI
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Zip iOS App Build
        run: |
          cd ios/App/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../Clippi-iOS-App.zip App.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clippi-ios-app
          path: Clippi-iOS-App.zip
